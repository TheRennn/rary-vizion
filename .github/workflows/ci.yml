name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npm run typecheck -w apps/web
      - run: npm test -w apps/api
      - run: npm run test:redis-integration -w apps/api
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web
      - name: Validate API runtime image
        run: docker build --file apps/api/Dockerfile --target runtime --tag rary-vizion-api:ci .
      - name: Validate web standalone image
        run: docker build --file apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid/api --target runtime --tag rary-vizion-web:ci .
